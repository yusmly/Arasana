<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARASANA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep: #1B1230;
    --deep-2: #241A3D;
    --purple: #7C3AED;
    --magenta: #D6409F;
    --coral: #F0475A;
    --gold: #F5A623;
    --ink: #F5EEFF;
    --ink-dim: #C7B8E8;
    --card: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 20% -10%, rgba(124,58,237,0.35), transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, rgba(240,71,90,0.25), transparent 55%),
      var(--deep);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 20px 60px;
    transition:padding 0.5s ease;
  }
  body.searched{padding-top:4vh;}

  /* ---------- LOGO ---------- */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    user-select:none;
    cursor:pointer;
  }
  .logo-img{
    height:150px;
    width:auto;
    display:block;
    transition:height 0.4s ease;
    filter:drop-shadow(0 6px 24px rgba(214,64,159,0.25));
  }
  .logo-img.spin-globe{ animation: pulseLogo 1.1s ease-in-out infinite; }
  @keyframes pulseLogo{ 0%,100%{ opacity:1; } 50%{ opacity:0.6; } }
  .tagline{
    color:var(--ink-dim);
    font-size:14px;
    font-weight:500;
    margin-top:2px;
    letter-spacing:0.2px;
  }
  body.searched .logo-img{ height:78px; }
  body.searched .tagline{ display:none; }

  /* ---------- SEARCH ---------- */
  .search-shell{
    width:100%;
    max-width:640px;
    margin-top:36px;
  }
  body.searched .search-shell{ margin-top:28px; }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1.5px solid var(--card-border);
    border-radius:999px;
    padding:14px 20px;
    backdrop-filter:blur(6px);
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .search-box:focus-within{
    border-color:var(--magenta);
    box-shadow:0 0 0 4px rgba(214,64,159,0.15);
  }
  .search-box input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:17px;
    font-weight:500;
  }
  .search-box input::placeholder{ color:var(--ink-dim); }
  .search-btn{
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:10px 20px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    color:#fff;
    background:linear-gradient(135deg, var(--purple), var(--coral));
    transition:transform 0.15s ease, opacity 0.15s ease;
    white-space:nowrap;
  }
  .search-btn:hover{ transform:translateY(-1px); }
  .search-btn:active{ transform:translateY(0px) scale(0.98); }
  .search-btn:disabled{ opacity:0.6; cursor:default; transform:none; }

  .hint-row{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .hint-chip{
    font-size:13px;
    color:var(--ink-dim);
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.03);
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .hint-chip:hover{ background:rgba(255,255,255,0.08); color:var(--ink); }

  /* ---------- RESULTS ---------- */
  .results-shell{
    width:100%;
    max-width:680px;
    margin-top:34px;
    display:none;
    flex-direction:column;
    gap:22px;
  }
  .results-shell.show{ display:flex; }

  .status-line{
    color:var(--ink-dim);
    font-size:13px;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold);
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  .answer-card{
    position:relative;
    border-radius:20px;
    padding:2px;
    background:linear-gradient(135deg, var(--purple), var(--coral) 50%, var(--gold));
    animation:fadeIn 0.5s ease;
  }
  .answer-card-inner{
    background:var(--deep-2);
    border-radius:18px;
    padding:22px 24px;
  }
  .answer-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-bottom:10px;
  }
  .answer-text{
    font-size:17px;
    line-height:1.55;
    color:var(--ink);
  }

  .results-list{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .results-list-label{
    font-family:'Baloo 2', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin:0 4px 10px;
  }
  .result-item{
    padding:14px 16px;
    border-radius:14px;
    border:1px solid var(--card-border);
    background:var(--card);
    margin-bottom:10px;
    animation:fadeIn 0.4s ease;
    transition:border-color 0.2s ease, transform 0.15s ease;
  }
  .result-item:hover{ border-color:rgba(214,64,159,0.5); transform:translateX(2px); }
  .result-title{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    text-decoration:none;
    display:block;
    margin-bottom:4px;
  }
  .result-url{
    font-size:12.5px;
    color:var(--gold);
    opacity:0.85;
    margin-bottom:6px;
    word-break:break-all;
  }
  .result-snippet{
    font-size:13.5px;
    color:var(--ink-dim);
    line-height:1.5;
  }

  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .error-box{
    text-align:center;
    color:var(--ink-dim);
    font-size:14px;
    padding:20px;
  }

  .footer-note{
    margin-top:40px;
    font-size:12px;
    color:var(--ink-dim);
    opacity:0.6;
    text-align:center;
  }

  @media (max-width: 480px){
    .wordmark{ font-size:42px; }
    .globe-wrap{ width:48px; height:48px; }
  }
</style>
</head>

  </div>
  <div class="tagline">gerçek cevap, gereksiz gürültü yok</div>

  <div class="search-shell">
    <div class="search-box">
      <input id="queryInput" type="text" placeholder="Bişey sor bakalım..." autocomplete="off">
      <button class="search-btn" id="searchBtn">Arasana</button>
    </div>
    <div class="hint-row" id="hintRow">
      <div class="hint-chip">İstanbul'da hava nasıl</div>
      <div class="hint-chip">En iyi python IDE</div>
      <div class="hint-chip">Türk kahvesi nasıl yapılır</div>
    </div>
  </div>

  <div class="results-shell" id="resultsShell">
    <div class="status-line" id="statusLine" style="display:none;">
      <span class="dot"></span> ARASANA aranıyor...
    </div>
    <div id="answerArea"></div>
    <div id="listArea"></div>
  </div>

  <div class="footer-note">ARASANA · deneysel bir arama motoru projesi</div>

<script>
  const brand = document.getElementById('brand');
  const logoImg = document.getElementById('logoImg');
  const input = document.getElementById('queryInput');
  const btn = document.getElementById('searchBtn');
  const hintRow = document.getElementById('hintRow');
  const resultsShell = document.getElementById('resultsShell');
  const statusLine = document.getElementById('statusLine');
  const answerArea = document.getElementById('answerArea');
  const listArea = document.getElementById('listArea');

  function escapeHtml(str){
    return (str || '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function domainOf(url){
    try{ return new URL(url).hostname.replace('www.',''); }
    catch(e){ return url; }
  }

  brand.addEventListener('click', () => {
    document.body.classList.remove('searched');
    resultsShell.classList.remove('show');
    answerArea.innerHTML = '';
    listArea.innerHTML = '';
    input.value = '';
    hintRow.style.display = 'flex';
  });

  hintRow.addEventListener('click', (e) => {
    if(e.target.classList.contains('hint-chip')){
      input.value = e.target.textContent;
      runSearch();
    }
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runSearch();
  });
  btn.addEventListener('click', runSearch);

  // Chrome arama motoru desteği: URL'de ?q=... varsa otomatik ara
  (function autoRunFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if(q && q.trim()){
      input.value = q.trim();
      runSearch();
    }
  })();

  async function runSearch(){
    const query = input.value.trim();
    if(!query) return;

    document.body.classList.add('searched');
    hintRow.style.display = 'none';
    resultsShell.classList.add('show');
    statusLine.style.display = 'flex';
    logoImg.classList.add('spin-globe');
    answerArea.innerHTML = '';
    listArea.innerHTML = '';
    btn.disabled = true;

    try{
      const response = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });

      const parsed = await response.json();

      if(parsed.error){
        throw new Error(parsed.error);
      }

      renderResults(parsed);

    }catch(err){
      console.error('ARASANA hata:', err);
      answerArea.innerHTML = `<div class="error-box">Bir şeyler ters gitti, ARASANA şu an cevap veremedi. Tekrar dener misin?</div>`;
    }finally{
      statusLine.style.display = 'none';
      logoImg.classList.remove('spin-globe');
      btn.disabled = false;
    }
  }

  function renderResults(parsed){
    if(parsed.answer){
      answerArea.innerHTML = `
        <div class="answer-card">
          <div class="answer-card-inner">
            <div class="answer-label">⚡ En faydalı cevap</div>
            <div class="answer-text">${escapeHtml(parsed.answer)}</div>
          </div>
        </div>
      `;
    }

    if(parsed.results && parsed.results.length){
      let html = `<div class="results-list"><div class="results-list-label">Eşleşen siteler</div>`;
      parsed.results.forEach(r => {
        html += `
          <div class="result-item">
            <a class="result-title" href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title)}</a>
            <div class="result-url">${escapeHtml(domainOf(r.url))}</div>
            <div class="result-snippet">${escapeHtml(r.snippet || '')}</div>
          </div>
        `;
      });
      html += `</div>`;
      listArea.innerHTML = html;
    }
  }
</script>
</body>
</html>
